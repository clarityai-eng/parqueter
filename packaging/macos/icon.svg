<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source for AppIcon.icns. Regenerate with scripts/make-icon-macos.sh -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a3f"/>
      <stop offset="1" stop-color="#14141f"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a6c8ff"/>
      <stop offset="1" stop-color="#6d9cf0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b8ff"/>
      <stop offset="1" stop-color="#a77ef0"/>
    </linearGradient>
  </defs>

  <!-- macOS icon grid: 824px body centred on a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Header row -->
  <rect x="212" y="232" width="184" height="96" rx="22" fill="url(#header)"/>
  <rect x="420" y="232" width="184" height="96" rx="22" fill="url(#header)"/>
  <rect x="628" y="232" width="184" height="96" rx="22" fill="url(#header)"/>

  <!-- Body rows: middle column highlighted (a selected column) -->
  <g fill="#3a3a52">
    <rect x="212" y="352" width="184" height="86" rx="18"/>
    <rect x="628" y="352" width="184" height="86" rx="18"/>
    <rect x="212" y="458" width="184" height="86" rx="18"/>
    <rect x="628" y="458" width="184" height="86" rx="18"/>
    <rect x="212" y="564" width="184" height="86" rx="18"/>
    <rect x="628" y="564" width="184" height="86" rx="18"/>
    <rect x="212" y="670" width="184" height="86" rx="18"/>
    <rect x="628" y="670" width="184" height="86" rx="18"/>
  </g>
  <rect x="420" y="352" width="184" height="404" rx="18" fill="url(#accent)"/>

  <!-- Text hints in cells -->
  <g fill="#cdd6f4" fill-opacity="0.55">
    <rect x="240" y="388" width="110" height="14" rx="7"/>
    <rect x="656" y="388" width="90" height="14" rx="7"/>
    <rect x="240" y="494" width="80" height="14" rx="7"/>
    <rect x="656" y="494" width="120" height="14" rx="7"/>
    <rect x="240" y="600" width="124" height="14" rx="7"/>
    <rect x="656" y="600" width="70" height="14" rx="7"/>
    <rect x="240" y="706" width="96" height="14" rx="7"/>
    <rect x="656" y="706" width="104" height="14" rx="7"/>
  </g>
  <g fill="#1e1e2e" fill-opacity="0.45">
    <rect x="448" y="388" width="100" height="14" rx="7"/>
    <rect x="448" y="494" width="124" height="14" rx="7"/>
    <rect x="448" y="600" width="84" height="14" rx="7"/>
    <rect x="448" y="706" width="112" height="14" rx="7"/>
  </g>
  <g fill="#1e1e2e" fill-opacity="0.5">
    <rect x="240" y="273" width="100" height="14" rx="7"/>
    <rect x="448" y="273" width="84" height="14" rx="7"/>
    <rect x="656" y="273" width="112" height="14" rx="7"/>
  </g>
</svg>
