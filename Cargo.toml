[package]
name = "parqueter"
version = "0.2.5"
edition = "2024"

[dependencies]
parquet = { version = "60.1.0", features = ["arrow"] }
arrow-array = "60.1.0"
arrow-cast = { version = "60.1.0", features = ["prettyprint"] }
arrow-schema = "60.1.0"
arrow-select = "60.1.0"
arrow = { version = "60.1.0", features = ["prettyprint"] }
lru = "0.14"
rayon = "1"
aho-corasick = "1"
bytes = "1"
futures = "0.3"
url = "2"
gpui = { git = "https://github.com/zed-industries/zed", rev = "985bbf42e684" }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "985bbf42e684", features = ["font-kit", "wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "985bbf42e684", features = ["font-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "985bbf42e684" }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "985bbf42e684", features = ["test-support"] }
